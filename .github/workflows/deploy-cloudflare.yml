name: Deploy Transporte Ramón to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: transporte-ramon-db
      DOMAIN: transporteramon.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.25.0 --activate

      - name: Restore project source
        shell: bash
        run: |
          set -euo pipefail
          tar -xf site-release.tar
          if [ -f site-release-labels.tar ]; then tar -xf site-release-labels.tar; fi
          test -f package.json
          test -d app
          test -d db

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure production D1
        shell: bash
        run: |
          set -euo pipefail
          DB_JSON="$(pnpm exec wrangler d1 list --json)"
          DB_ID="$(printf '%s' "$DB_JSON" | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid' | head -n1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_JSON="$(pnpm exec wrangler d1 create "$DB_NAME" --json)"
            DB_ID="$(printf '%s' "$CREATE_JSON" | jq -r '.uuid')"
          fi
          test -n "$DB_ID" && test "$DB_ID" != "null"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

          node <<'NODE'
          const fs = require('fs');
          const p = 'dist/server/wrangler.json';
          const c = JSON.parse(fs.readFileSync(p, 'utf8'));
          c.name = 'transporte-ramon';
          c.compatibility_date = c.compatibility_date || '2026-09-24';
          c.compatibility_flags = [...new Set([...(c.compatibility_flags || []), 'nodejs_compat'])];
          c.d1_databases = (c.d1_databases || []).map(x => ({
            ...x,
            database_name: process.env.DB_NAME,
            database_id: process.env.DB_ID
          }));
          if (!c.d1_databases.length) {
            c.d1_databases = [{ binding: 'DB', database_name: process.env.DB_NAME, database_id: process.env.DB_ID }];
          }
          c.routes = [{ pattern: process.env.DOMAIN, custom_domain: true }];
          fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          NODE

      - name: Apply D1 migrations
        shell: bash
        run: |
          if [ -d drizzle ]; then
            pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote --config dist/server/wrangler.json
          fi

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
